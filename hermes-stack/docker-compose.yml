# Hermes Agent Stack

services:
  hermes-agent:
    image: nousresearch/hermes-agent:complete
    container_name: hermes-agent
    restart: unless-stopped
    command: gateway run
    ports:
      - "8642:8642"
    volumes:
      - ./data:/opt/data
    networks:
      - agent-net

networks:
  agent-net:
    external: true
