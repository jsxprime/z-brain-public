# Docker Compose configuration

services:
  # The CORE Web App & Memory Orchestrator
  core-app:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: core-app
    restart: unless-stopped
    ports:
      - "3033:3033"
    environment:
      - REMIX_APP_PORT=3033
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - DIRECT_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - SESSION_SECRET=${SESSION_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - MAGIC_LINK_SECRET=${MAGIC_LINK_SECRET}
      - LOGIN_ORIGIN=${LOGIN_ORIGIN}
      - APP_ORIGIN=${APP_ORIGIN}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_TLS_DISABLED=true
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_GENERATIVE_AI_API_KEY=${GOOGLE_GENERATIVE_AI_API_KEY}
      - CHAT_PROVIDER=${CHAT_PROVIDER}
      - MODEL=${MODEL}
      - EMBEDDINGS_PROVIDER=${EMBEDDINGS_PROVIDER}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - EMBEDDING_MODEL_SIZE=${EMBEDDING_MODEL_SIZE}
      - OLLAMA_URL=${OLLAMA_URL}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - POSTGRES_DB=${POSTGRES_DB}
      - QUEUE_PROVIDER=bullmq
      - VECTOR_PROVIDER=${VECTOR_PROVIDER}
    depends_on:
      - postgres
      - redis
      - neo4j
    networks:
      - agent-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.core.rule=Host(`core.example.com`)"
      - "traefik.http.routers.core.entrypoints=websecure"
      - "traefik.http.routers.core.tls=true"
      - "traefik.http.routers.core.tls.certresolver=cloudflare"
      - "traefik.http.services.core.loadbalancer.server.port=3033"

  # Relational Database
  postgres:
    image: pgvector/pgvector@sha256:bd12d6788a617f4147d5a2ae0b56d07921398adabfe5a033bd3f50c245df55a1  # pg15
    container_name: core-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - agent-net

  # Knowledge Graph (Neo4j)
  neo4j:
    image: neo4j@sha256:0b5d3ab6ec1b866890dbfb53bf4fe1cf039f9e03c96165599a403005b7e7bcc3  # 5-community
    container_name: core-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_auth__enabled: "false"
    volumes:
      - ./data/neo4j:/data
      - ./data/neo4j-plugins:/plugins
    networks:
      - agent-net

  # Queue & Cache (Redis)
  redis:
    image: redis@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99  # 7-alpine
    container_name: core-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - ./data/redis:/data
    networks:
      - agent-net

networks:
  agent-net:
    external: true
