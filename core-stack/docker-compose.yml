# Docker Compose configuration

services:
  # The CORE Web App & Memory Orchestrator
  core-app:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: core-app
    restart: unless-stopped
    ports:
      - "3033:3033"
    environment:
      - REMIX_APP_PORT=3033
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - DIRECT_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - SESSION_SECRET=${SESSION_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - MAGIC_LINK_SECRET=${MAGIC_LINK_SECRET}
      - LOGIN_ORIGIN=${LOGIN_ORIGIN}
      - APP_ORIGIN=${APP_ORIGIN}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_TLS_DISABLED=true
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - POSTGRES_DB=${POSTGRES_DB}
      - QUEUE_PROVIDER=bullmq
    depends_on:
      - postgres
      - redis
      - neo4j
    networks:
      - agent-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.core.rule=Host(`core.example.com`)"
      - "traefik.http.routers.core.entrypoints=websecure"
      - "traefik.http.routers.core.tls=true"
      - "traefik.http.routers.core.tls.certresolver=cloudflare"
      - "traefik.http.services.core.loadbalancer.server.port=3033"

  # Relational Database
  postgres:
    image: pgvector/pgvector:pg15
    container_name: core-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - agent-net

  # Knowledge Graph (Neo4j)
  neo4j:
    image: neo4j:5-community
    container_name: core-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - ./data/neo4j:/data
      - ./data/neo4j-plugins:/plugins
    networks:
      - agent-net

  # Queue & Cache (Redis)
  redis:
    image: redis:7-alpine
    container_name: core-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - ./data/redis:/data
    networks:
      - agent-net

networks:
  agent-net:
    external: true
